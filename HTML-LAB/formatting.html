<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Formatting</title>
</head>
<body>
    <p><b>bold</b>text</p>
    <p><strong>strong</strong>text</p>
    <p><i>italized</i>text</p>
    <p><em>emphasized</em>text</p>
    <p><u>underlined</u>text</p>
    <p><mark>highlighted</mark>text</p>
    <p><small>smaller</small>text</p>
    <p><del>delete</del>text</p>
    <p><ins>insert</ins>text</p>
    <p><sub>subscript</sub>text</p>
    <p><sup>superscript</sup>text</p>
    


    <p>
     
    <b>H2<strong>O</b>
        <p></p>
    <em>E = mc</em>2

    </p>
