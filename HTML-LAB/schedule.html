<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Tables</title>
</head>
<body>

    <h2>Weekly Class Schedule</h2>
    
    <table>
        <thead>
            <tr>
                <th>Day</th>
                <th>Time</th>
                <th>Subject</th>
                <th>Room</th>
                <th>Instructor</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">Monday</td>
                <td>8:50 AM - 10:10 AM</td>
                <td>Cit 14 LAB</td>
                <td>M307</td>
                <td>Sir. Prim</td>
            </tr>
            <tr>
                <td>10:10 AM - 11:30 AM</td>
                <td>Cit 14 Lecture</td>
                <td>M307</td>
                <td>Sir. Prim</td>
            </tr>
            <tr>
                <td colspan="5">Free Time (11:30 AM - 2:10 PM)</td>
            </tr>
        </tbody>
    </table>




</body>
</html>
